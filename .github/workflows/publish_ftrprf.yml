name: Publish package

on:
  push:
    branches:
      - develop

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://npm.pkg.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Build scratch-svg-renderer
        run: npm run build --workspace @scratch/scratch-svg-renderer

      - name: Build scratch-render
        run: npm run build --workspace @scratch/scratch-render

      - name: Build scratch-vm
        run: npm run build --workspace @scratch/scratch-vm

      - name: Build
        run: npm run build:dist --workspace=@ftrprf/scratch-gui-react18

      - name: Publish to GitHub Packages
        run: npm publish --workspace=@scratch/scratch-gui-react18
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
